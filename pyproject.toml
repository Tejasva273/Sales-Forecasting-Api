[project]
name = "sales-forecasting-api"
version = "1.0.0"
description = "Sales Forecasting & Analytics API — FastAPI + scikit-learn + SQLAlchemy"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E402"]  # module-level imports after matplotlib.use() are intentional

[tool.ruff.lint.per-file-ignores]
# B008: FastAPI relies on Depends()/Query() as argument defaults — this is the
# documented, correct pattern, not a bug.
"app/api/*" = ["B008"]
"tests/*" = ["B", "E501"]
"scripts/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
